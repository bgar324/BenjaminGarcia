<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>2:54 am</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eeeade" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preload" href="/static/inter-page.woff2?v=1" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/ben-and-jadyns-future/letter.css" />
    <script src="/ben-and-jadyns-future/letter.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <img class="snoopy" src="/static/snoopy/sleeping.webp" width="600" height="299" alt="Snoopy sleeping on his back" />
        <h1 id="title" tabindex="-1">2:54 am</h1>
      </header>
      <form id="unlock" aria-label="Unlock letter">
        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="status" />
          <button type="submit">Unlock</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <noscript><p>Enable JavaScript to unlock this letter.</p></noscript>
      <article id="letter" aria-labelledby="title" hidden></article>
      <img class="closing-snoopy" src="/static/snoopy/heart.webp" width="360" height="348" alt="Snoopy peeking over a red heart" loading="lazy" />
    </main>
  </body>
</html>
